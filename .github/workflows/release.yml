name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release 标签，例如 v0.1.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. Go：六平台节点 + Linux Broker ──────────────────────────
  build-go:
    name: Go 六平台节点 + Broker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 发布前门禁
        run: |
          go vet ./...
          go test ./... -count=1
      - name: 交叉编译
        run: |
          set -euo pipefail
          mkdir -p dist/dl
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" \
            -o dist/dl/starstack-server-linux-amd64 ./cmd/server
          for t in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            os=${t%/*}; arch=${t#*/}
            ext=""; [ "$os" = "windows" ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" \
              -o "dist/dl/starstack-worker-${os}-${arch}${ext}" ./cmd/worker
          done
          ls -lh dist/dl
      - uses: actions/upload-artifact@v4
        with:
          name: assets-go
          path: dist/dl/*
          if-no-files-found: error

  # ── 2. Web 控制台产物：桌面端与安卓共用同一份 React 构建 ────────
  # ── 2. Web 控制台产物：桌面端内嵌的就是这一份 ──────────────────
  # 曾经构建的是 apps/mobile（Capacitor 时代，已废弃）。现在唯一 UI 源是 web-react，
  # 桌面 exe 与鸿蒙 rawfile 都从它的 dist 取。
  build-web:
    name: Web 控制台产物（web-react）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-react/package-lock.json
      - name: npm ci + vite build
        run: |
          npm ci --prefix web-react
          npm run build --prefix web-react
          test -f web-react/dist/index.html
          test -f web-react/dist/build.json
      - uses: actions/upload-artifact@v4
        with:
          name: web-react-dist
          path: web-react/dist/
          if-no-files-found: error

  # ── 3. Windows 桌面：自包含单文件 exe ──────────────────────────
  # WPF + WebView2 只能在 Windows 上构建；csproj 把 web-react/dist 内嵌进 exe。
  build-desktop:
    name: Windows 桌面单文件 exe
    needs: build-web
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-react-dist
          path: web-react/dist
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # exe 内嵌的是 web-react-dist 这一份快照。artifact 缺构建戳说明拿到的不是本次
      # 构建产物，宁可不发版，也不要把上一版的网页封进"新" exe。
      - name: 校验内嵌网页带构建戳
        shell: pwsh
        run: |
          $stamp = 'web-react/dist/build.json'
          if (-not (Test-Path $stamp)) { throw "web-react-dist 缺少 $stamp，拒绝打包旧网页" }
          Get-Content $stamp
      - name: dotnet publish（自包含单文件）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/dl | Out-Null
          dotnet publish apps/desktop/StarStack.Desktop.csproj -c Release -r win-x64 `
            --self-contained true -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false `
            -o dist-desktop
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish 失败' }
          Copy-Item dist-desktop/StarStack.Desktop.exe dist/dl/StarStack.Desktop.exe
          Get-Item dist/dl/StarStack.Desktop.exe | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: assets-desktop
          path: dist/dl/*
          if-no-files-found: warn

  # ── 4. Windows 桌面：RNW 原生端（实验，复用 desktop-rn.yml） ───
  # 旧的 WPF 套壳（apps/desktop）已作为交付形态下线；这里出的是 RNW 0.84 的原生 exe。
  # 用 reusable workflow 而不是把步骤抄一遍：本地 Win10 编不出来，CI 是唯一验证入口。
  build-desktop-rn:
    name: Windows 桌面 RN 端（RNW）
    uses: ./.github/workflows/desktop-rn.yml

  # ── 5. Android：RN 原生端（Expo prebuild + Gradle） ────────────
  # 手机端唯一形态是 apps/mobile-rn（RN 界面 + Kotlin 前台 Service，同时是算力节点）。
  # 老的 Capacitor 包（apps/android + apps/mobile）已废弃停发：界面旧、还和 RN 包同名，
  # 两个包一起发出去只会让人下错。
  #
  # 必须走 assembleRelease：debug 变体按 debuggableVariants 跳过 JS 打包，
  # 装到手机上没有 Metro 就是白屏 —— 那种包装不了也发不得。
  build-android:
    name: Android 安装包（RN / release）
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile-rn/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # 不要用 android-actions/setup-android：它在 ubuntu 镜像上会跟预装的 SDK 抢目录，
      # 实测第一次发版就挂在这一步（job 2 分钟内失败，后面全 skipped）。
      # runner 自带 ANDROID_HOME，缺的包这里显式补，补不上再交给 AGP 自己拉。
      - name: 准备 Android SDK（许可 + NDK / 平台 / build-tools）
        run: |
          set -uo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          sm="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sm" ]; then
            echo "::error::runner 上没有 sdkmanager，ANDROID_HOME=$ANDROID_HOME"
            ls "$ANDROID_HOME" || true
            exit 1
          fi
          yes | "$sm" --licenses > /dev/null || true
          pkgs="platform-tools cmake;3.22.1 ndk;27.1.12297006 platforms;android-37 build-tools;37.0.0"
          "$sm" $pkgs || "$sm" --channel=3 $pkgs || echo "::warning::部分 SDK 包装不上，交给 AGP 自动补"
      - name: npm ci + expo prebuild
        working-directory: apps/mobile-rn
        run: |
          npm ci
          npx expo prebuild --platform android --no-install
          test -f android/gradlew
          # prebuild 会重写 android/，sdk.dir 只能在这之后补
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: gradle assembleRelease
        working-directory: apps/mobile-rn/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --console=plain
      - name: 收集 APK
        run: |
          set -euo pipefail
          mkdir -p dist/dl
          apk=apps/mobile-rn/android/app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          cp "$apk" dist/dl/StarStack-RN.apk
          ls -lh dist/dl/StarStack-RN.apk
          # 包里必须有 JS bundle，否则就是没打包的 debug 残次品
          unzip -l dist/dl/StarStack-RN.apk | grep -q 'assets/index.android.bundle'
      - uses: actions/upload-artifact@v4
        with:
          name: assets-android
          path: dist/dl/StarStack-RN.apk
          if-no-files-found: error

  # ── 5. 小程序 / 鸿蒙源码包 ────────────────────────────────────
  # 小程序没有可安装文件（appid 是 touristappid 测试号）；鸿蒙 HAP 需要
  # DevEco Studio 5.x + 华为账号签名，CI 里构建不出来。因此发布源码包。
  build-sources:
    name: 小程序 / 鸿蒙源码包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 打包源码
        run: |
          set -euo pipefail
          mkdir -p dist/dl
          (cd apps && zip -qr ../dist/dl/starstack-miniapp-source.zip miniapp \
            -x '*/node_modules/*' '*.log')
          (cd apps && zip -qr ../dist/dl/starstack-harmony-source.zip harmony \
            -x '*/oh_modules/*' '*/node_modules/*' '*/build/*' '*.log')
          # 鸿蒙原生端（RNOH）与旧的 ArkWeb 壳一起打包：前者是后续唯一目标，
          # 后者留给还在用 DevEco 5.x 的旧工程做对照。
          (cd apps && zip -qr ../dist/dl/starstack-harmony-source.zip harmony-rn \
            -x '*/oh_modules/*' '*/node_modules/*' '*/build/*' '*/.hvigor/*' '*.log')
          ls -lh dist/dl
      - uses: actions/upload-artifact@v4
        with:
          name: assets-sources
          path: dist/dl/*
          if-no-files-found: error

  # ── 6. 汇总发布 ───────────────────────────────────────────────
  # 重工具链的四个 job 允许失败；只有 Go 门禁失败才阻断发布。
  # 缺哪端资产，页面会把它标成「该版本未包含」，不会给出死链。
  publish:
    name: 汇总发布 GitHub Release
    needs: [build-go, build-desktop, build-desktop-rn, build-android, build-sources]
    if: ${{ always() && needs.build-go.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: assets-*
          path: dist/dl
          merge-multiple: true
      - name: 生成统一校验和
        run: |
          set -euo pipefail
          cd dist/dl
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\n' \
            | sort | xargs -r sha256sum > SHA256SUMS.txt
          echo "== 本版资产 =="
          ls -lh
      - name: 点名缺失的资产
        run: |
          set -euo pipefail
          cd dist/dl
          missing=0
          for f in StarStack.Desktop.exe StarStack-Desktop-RN.zip StarStack-RN.apk \
                   starstack-server-linux-amd64 \
                   starstack-miniapp-source.zip starstack-harmony-source.zip; do
            if [ ! -f "$f" ]; then
              echo "::warning::本版缺少 $f（对应构建 job 失败或被跳过）"
              missing=$((missing + 1))
            fi
          done
          echo "缺失 $missing 个客户端/服务端资产；欢迎页会把它们标成「该版本未包含」，不会给出死链。"
      - name: 解析标签
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: StarStack ${{ steps.meta.outputs.tag }}
          files: dist/dl/*
          generate_release_notes: true
          body: |
            由 `.github/workflows/release.yml` 自动构建：Go 六平台节点 + Linux Broker、
            Windows 桌面单文件 exe、Windows RNW 原生端、Android 安装包、
            微信小程序与 HarmonyOS 源码包。

            - `SHA256SUMS.txt` 覆盖本版全部文件，用 `sha256sum -c SHA256SUMS.txt` 校验。
            - 微信小程序包是**源码**，用微信开发者工具「导入项目」打开（`touristappid` 为测试号）。
            - HarmonyOS 包是**源码**，需 DevEco Studio 5.x（API 12+）+ 华为账号自动签名。
            - **Windows RNW（`StarStack-Desktop-RN.zip`）**：`react-native-windows` 原生桌面端
              （不是 WebView 套壳），release 变体已内嵌 JS bundle，解压后双击
              `StarStackDesktop.exe` 即可；需要与 `starstack-worker.exe` 放同目录才能开本机节点。
            - **Android（`StarStack-RN.apk`）**：RN + Kotlin 前台服务同一份安装包，release 变体已内嵌
              JS bundle，装上就能跑、不需要 Metro；arm64-v8a，minSdk 24。签名沿用工程内的 debug
              keystore（内测/自用），上架应用商店前必须换正式签名。
            - Windows 桌面依赖 .NET 8；若本版缺少对应文件，说明该构建步骤失败，
              构建方式见 `apps/README.md`。欢迎页会把缺失资产标为「该版本未包含」。

            完整说明：https://home.starstack.run/

  deploy-home:
    name: 刷新欢迎页（下载区读取新 Release）
    needs: publish
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 检查 Cloudflare 密钥
        id: guard
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 Cloudflare 密钥，跳过欢迎页刷新；页面会在访客侧直接读取新 Release，不影响下载。"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: wrangler deploy
        if: steps.guard.outputs.ready == 'true'
        working-directory: home
        run: npx --yes wrangler@latest deploy
