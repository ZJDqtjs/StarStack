name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go 测试与静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # 仓库 blob 是 LF，但 Windows 本地 core.autocrlf=true 会检出成 CRLF。
      # 先剥掉 \r 再比 gofmt，避免把纯行尾差异当成格式错误。
      - name: gofmt（忽略行尾差异）
        run: |
          bad=""
          for f in $(git ls-files '*.go'); do
            tr -d '\r' < "$f" > /tmp/ss-gofmt-in.go
            if [ -n "$(gofmt -d /tmp/ss-gofmt-in.go 2>/dev/null)" ]; then
              bad="$bad $f"
            fi
          done
          if [ -n "$bad" ]; then
            echo "以下 Go 文件与 gofmt 不一致：$bad"
            exit 1
          fi
          echo "gofmt 检查通过"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -count=1

  site:
    name: 欢迎页校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JS 语法
        run: node --check home/public/app.js
      - name: 站点与下载清单一致性
        run: node home/scripts/verify-site.cjs

  # 多端控制台同步检查。
  # 桌面 exe / Android APK / 鸿蒙壳内嵌的是构建期快照，web 更新了它们不会自动跟上。
  # 这个 job 保证：两端 vite 都注入构建戳、桌面端门禁没被绕过、mobile 的每个视图
  # 在 web-react 里有对应路由。建议在仓库分支保护里把它设为 required check。
  console:
    name: 多端控制台同步检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 视图清单与构建戳契约
        run: node scripts/verify-console-sync.cjs
      - name: web-react 产物必须带构建戳（exe 与鸿蒙内嵌的就是它）
        run: |
          npm ci --prefix web-react
          npm run build --prefix web-react
          node -e "const s=require('./web-react/dist/build.json'); if(!s.sha||!s.time) throw new Error('web-react 产物缺构建戳'); console.log('web-react 戳:', s.sha, s.time)"
          test -f web-react/dist/index.html

  # 鸿蒙源码包里要带预生成的 HBC（Index.ets 的发布态只认 rawfile 里的 hermes_bundle.hbc）。
  # 这条链路依赖 RN 0.84 的 hermesc（在 hermes-compiler 包里，CLI 默认路径找不到，
  # 所以 package.json 的 harmony 脚本显式传了 --hermesc-dir）。
  # 在 PR 上先跑一遍，避免发版时才发现打不出 bundle。
  harmony:
    name: 鸿蒙 HBC bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/harmony-rn/package-lock.json
      - name: npm ci + bundle-harmony
        working-directory: apps/harmony-rn
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run harmony
          hbc=harmony/entry/src/main/resources/rawfile/hermes_bundle.hbc
          test -s "$hbc" || { echo '::error::hermes_bundle.hbc 没生成'; exit 1; }
          ls -lh "$hbc"

  deploy-home:
    name: 部署欢迎页到 Cloudflare Workers
    needs: [go, site]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 检查 Cloudflare 密钥
        id: guard
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，跳过部署。配置方式见 home/README.md"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: wrangler deploy
        if: steps.guard.outputs.ready == 'true'
        working-directory: home
        run: npx --yes wrangler@latest deploy
