# /etc/nginx/sites-available/mc-subdomain
#
# 星轨图鉴子域入口：mc.starstack.run 直接打开图鉴（无需 /mc 前缀）。
# 站点构建产物里的资源仍是绝对路径 /mc/...，所以 /mc/ 与 /functions/ 继续
# 反代到 127.0.0.1:8090，根路径映射到 /mc/ 交给同一个 Node 服务。
#
# DNS：Cloudflare 泛解析（*.starstack.run）已覆盖，无需单独加记录。
# 证书：
#   sudo certbot certonly --webroot -w /var/www/starstack-acme -d mc.starstack.run
#   sudo certbot renew --dry-run
# 续期后需要 reload nginx（webroot 模式不会自动 reload）。

server {
    listen 80;
    server_name mc.starstack.run;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/starstack-acme;
        default_type text/plain;
    }

    location ^~ /mc/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    location ^~ /functions/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8090/mc/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }
}

server {
    listen 443 ssl http2;
    server_name mc.starstack.run;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/mc.starstack.run/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mc.starstack.run/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    location ^~ /mc/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 20m;
    }

    location ^~ /functions/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 20m;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8090/mc/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 20m;
    }
}
