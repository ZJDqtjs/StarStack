# /etc/nginx/sites-available/starstack
#
# 独立域名入口：只匹配 starstack.run / www.starstack.run。
# 80 留给 ACME 和 HTTP，443 走 Let's Encrypt。
#
# 签发/续期：
#   sudo certbot certonly --webroot -w /var/www/starstack-acme \
#     -d starstack.run -d www.starstack.run
# certbot.timer 会负责续期；续期后 `systemctl reload nginx`（webroot 模式不会自动 reload，
# 可加 deploy hook：certbot renew --deploy-hook "systemctl reload nginx"）。
#
# Cloudflare 在前：必须用 Full / Full(strict)，origin 443 提供证书；
# SSL 模式若是 Flexible，只会用 origin 80，cookie 与安全头都会降级。
# X-Forwarded-For 取 Cloudflare 的 CF-Connecting-IP，broker 用 --trust-proxy 读取。
#
# 访问控制：控制台页面（/ 及静态资源）加 Basic Auth，仅维护者本人可访问；
# /api /v1 /download /dl /launch /comfy /comfyui 关闭认证，桌面端、安卓、小程序、
# 算力节点与 ComfyUI 工作台都依赖这些接口（/comfyui/api/ws 额外放行 Upgrade）。密码文件：
#   htpasswd -nb <user> <password> > /etc/nginx/starstack.htpasswd
#   chown root:www-data /etc/nginx/starstack.htpasswd && chmod 640 /etc/nginx/starstack.htpasswd
#
# 星轨图鉴公开挂在 /mc（snippets/mc-site.conf），另有子域入口
# mc.starstack.run（deploy/nginx-mc-subdomain.conf）。

map $http_cf_connecting_ip $ss_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

server {
    listen 80;
    server_name starstack.run www.starstack.run;
    server_tokens off;

    include snippets/mc-site.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/starstack-acme;
        default_type text/plain;
    }

    # ComfyUI 工作台的 WebSocket：必须单独放行 Upgrade，否则 /ws 会被降成普通 HTTP。
    location ~ ^/comfyui/api/ws$ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $ss_client_ip;
        proxy_set_header X-Forwarded-For $ss_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/(api|v1|download|dl|launch|comfy|comfyui)(/|$) {
        auth_basic off;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $ss_client_ip;
        proxy_set_header X-Forwarded-For $ss_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 600m;
    }

    location / {
        auth_basic "StarStack Private";
        auth_basic_user_file /etc/nginx/starstack.htpasswd;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $ss_client_ip;
        proxy_set_header X-Forwarded-For $ss_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 600m;
    }
}

server {
    listen 443 ssl http2;
    server_name starstack.run www.starstack.run;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/starstack.run/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/starstack.run/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include snippets/mc-site.conf;

    # HTTPS 入口同样要为 ComfyUI /ws 保留 Upgrade 头。
    location ~ ^/comfyui/api/ws$ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $ss_client_ip;
        proxy_set_header X-Forwarded-For $ss_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/(api|v1|download|dl|launch|comfy|comfyui)(/|$) {
        auth_basic off;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $ss_client_ip;
        proxy_set_header X-Forwarded-For $ss_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 600m;
    }

    location / {
        auth_basic "StarStack Private";
        auth_basic_user_file /etc/nginx/starstack.htpasswd;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $ss_client_ip;
        proxy_set_header X-Forwarded-For $ss_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 600m;
    }
}
